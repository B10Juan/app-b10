<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APP B10: Gestión</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div id="app"><div class="loading">Cargando…</div></div>
<dialog id="dlgAsg">
  <form method="dialog" id="fAsg">
    <h2 id="asgTitle"></h2>
    <p class="sub" id="asgSub"></p>
    <ul id="asgList"></ul>
    <div class="f2">
      <div class="f"><label for="asgRef">Nº de pedido</label><input id="asgRef" autocomplete="off" placeholder="PED 098100"></div>
      <div class="f"><label for="asgSize">Tamaño</label><select id="asgSize"></select></div>
    </div>
    <span class="hint" id="asgHint" style="font-size:12.5px;color:var(--ink-3)"></span>
    <span class="err" id="asgErr"></span>
    <div class="actions"><button type="button" class="btn" id="asgCancel">Cancelar</button><button class="btn pend">Crear pedido</button></div>
  </form>
</dialog>

<dialog id="dlgVer">
  <form method="dialog" id="fVer">
    <h2>Confirmar la modificación</h2>
    <p class="sub" id="verSub"></p>
    <div class="f"><label for="verRef">Nuevo nombre del pedido</label><input id="verRef" autocomplete="off"><span class="hint">La versión actual se guarda en el historial del pedido.</span></div>
    <span class="err" id="verErr"></span>
    <div class="actions"><button type="button" class="btn" id="verCancel">Cancelar</button><button class="btn ok">Confirmar y guardar versión</button></div>
  </form>
</dialog>

<dialog id="dlgProd">
  <form method="dialog" id="fProd" novalidate>
    <h2 id="prodTitle"></h2>
    <p class="sub" id="prodSub"></p>
    <div class="f2">
      <div class="f" data-f="codigo_ax"><label for="pCode">Código AX</label><input id="pCode" autocomplete="off" placeholder="P-COM-BAN-070"><span class="hint">Vacío si aún no está en AX (muestra).</span></div>
      <div class="f" data-f="model"><label for="pModel">Modelo</label><input id="pModel" autocomplete="off" placeholder="Vela"></div>
    </div>
    <div class="f" data-f="name"><label for="pName">Descripción</label><input id="pName" autocomplete="off" placeholder="Vela 1700x800"><span class="hint">Obligatoria.</span></div>
    <div class="f2">
      <div class="f" data-f="clave"><label for="pClave">Clave de stock (artículo + acabado)</label><input id="pClave" autocomplete="off" placeholder="P-COM-BAN-004BCO"><span class="hint">Como en SEARCHKEY2 del fichero de stock. Vacía = el código AX.</span></div>
      <div class="f" data-f="ext"><label for="pExt">Situación</label><label style="display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink);padding-top:6px"><input type="checkbox" id="pExt"> A extinguir: no se vuelve a comprar</label></div>
    </div>
    <div class="f2">
      <div class="f" data-f="stock"><label for="pStock">Stock actual (uds)</label><input id="pStock" inputmode="decimal"><span class="hint"></span></div>
      <div class="f" data-f="avg"><label for="pAvg">Venta media semanal</label><input id="pAvg" inputmode="decimal"><span class="hint"></span></div>
      <div class="f" data-f="ss"><label for="pSS">Stock de seguridad</label><input id="pSS" inputmode="decimal"><span class="hint"></span></div>
      <div class="f" data-f="pallet"><label for="pPal">Uds por pallet</label><input id="pPal" inputmode="numeric"><span class="hint"></span></div>
      <div class="f" data-f="price"><label for="pPrice">Precio proveedor (€)</label><input id="pPrice" inputmode="decimal"><span class="hint"></span></div>
    </div>
    <span class="err" id="pErr"></span>
    <div class="actions"><button type="button" class="btn" id="prodCancel">Cancelar</button><button class="btn primary" id="prodSave">Guardar</button></div>
  </form>
</dialog>

<datalist id="navieras"></datalist>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
